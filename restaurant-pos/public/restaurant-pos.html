<!DOCTYPE html>
<!-- Restaurant POS: single-file build of the browser interface (generated by tools/build-single-html.mjs; edit the sources, not this file).
     It needs the Restaurant POS server for its data: start it with "npm start" and open http://localhost:3000/restaurant-pos.html -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurant POS</title>
  <meta name="theme-color" content="#3d2817">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%222%22%20fill%3D%22%23c8553d%22%2F%3E%3Ctext%20x%3D%2216%22%20y%3D%2223%22%20text-anchor%3D%22middle%22%20font-family%3D%22Georgia%2Cserif%22%20font-size%3D%2220%22%20font-weight%3D%22900%22%20fill%3D%22%23f5ecd9%22%3Er%3C%2Ftext%3E%3C%2Fsvg%3E" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@400;500;700&family=Noto+Sans+Ethiopic:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
/* Management interface. Palette, typefaces and card/button styles carried over from the
   hotel website (Attachment 2). Receipt styling lives separately in receipt.css. */
:root {
  --ink: #3d2817;
  --ink-soft: #7a5e3a;
  --ink-faint: #9a7e5a;
  --paper: #f5ecd9;
  --card: #fffbf0;
  --line: #e8dcb8;
  --line-strong: #cdb88a;
  --accent: #c8553d;
  --accent-dark: #a64530;
  --gold: #b8770b;
  --ok: #5d8a52;
  --warn: #b8770b;
  --bad: #a64530;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: 'DM Sans', 'Noto Sans Ethiopic', system-ui, sans-serif; color: var(--ink); background: var(--paper);
  background-image: radial-gradient(circle at 25% 30%, rgba(184,119,11,.06) 0%, transparent 40%), radial-gradient(circle at 75% 70%, rgba(200,85,61,.05) 0%, transparent 40%);
  -webkit-font-smoothing: antialiased; font-size: 14px;
}
h1, h2, h3, .serif { font-family: 'Playfair Display', Georgia, serif; font-weight: 700; letter-spacing: -0.01em; }
h1 { font-size: 34px; margin-bottom: 4px; }
h2 { font-size: 22px; margin-bottom: 6px; }
h3 { font-size: 17px; margin-bottom: 6px; }
.sub { color: var(--ink-soft); margin-bottom: 20px; }
.muted { color: var(--ink-faint); }
.small { font-size: 12px; }
.mono { font-family: 'Space Mono', ui-monospace, monospace; }
input, select, button, textarea { font-family: inherit; font-size: 14px; }
button { cursor: pointer; touch-action: manipulation; }
button:disabled { opacity: .45; cursor: not-allowed; }
::-webkit-scrollbar { width: 6px; height: 6px; } ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 3px; }

.ink-card { background: var(--card); border: 1px solid var(--line); box-shadow: 0 1px 0 var(--line), 0 4px 18px rgba(61,40,23,.05); padding: 20px; }
.ink-btn { background: var(--accent); color: var(--card); border: none; padding: 10px 18px; border-radius: 2px; font-weight: 700; letter-spacing: .03em; transition: background .15s; }
.ink-btn:hover:not(:disabled) { background: var(--accent-dark); }
.ink-btn.ok { background: var(--ok); } .ink-btn.ok:hover:not(:disabled) { background: #4a7041; }
.ink-btn.dark { background: var(--ink); }
.ink-btn-ghost { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); padding: 9px 16px; border-radius: 2px; font-weight: 700; }
.ink-btn-ghost:hover:not(:disabled) { background: rgba(200,85,61,.08); }
.ink-btn-ghost.plain { color: var(--ink-soft); border-color: var(--line-strong); }
.btn-sm { padding: 6px 12px !important; font-size: 12px; }
.ink-input { background: var(--card); border: 1px solid var(--line-strong); padding: 9px 12px; border-radius: 2px; color: var(--ink); outline: none; width: 100%; }
.ink-input:focus { border-color: var(--accent); }
textarea.ink-input { resize: vertical; min-height: 70px; }
label.field { display: block; margin-bottom: 12px; }
label.field > span { display: block; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 4px; }
.check { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
.check input { width: 16px; height: 16px; accent-color: var(--accent); -webkit-appearance: auto; }
.divider-ornate { text-align: center; color: var(--gold); font-family: 'Playfair Display', serif; margin: 14px 0; letter-spacing: .4em; }

/* layout */
.topbar { background: var(--ink); color: var(--paper); padding: 14px clamp(16px,3vw,40px); border-bottom: 3px double var(--gold); display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.brand { font-family: 'Playfair Display', serif; font-size: 21px; color: var(--paper); }
.brand b { color: var(--accent); }
.nav { display: flex; gap: 4px; flex-wrap: wrap; }
.nav button { background: transparent; color: var(--line); border: none; padding: 8px 14px; border-radius: 2px; font-family: 'Playfair Display', serif; font-size: 15px; }
.nav button.active { background: var(--accent); color: var(--card); }
.who { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--line); }
.who button { background: transparent; color: var(--accent); border: 1px solid var(--accent); padding: 5px 12px; border-radius: 2px; font-size: 12px; }
.qz-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; background: transparent; border: none; color: inherit; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--ink-faint); }
.dot.ok { background: #8fc27f; box-shadow: 0 0 6px #8fc27f; } .dot.wait { background: var(--gold); } .dot.bad { background: var(--accent); }
main { padding: 26px clamp(16px,3vw,40px) 60px; max-width: 1400px; margin: 0 auto; }
.grid { display: grid; gap: 16px; }
.stats { grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); margin-bottom: 22px; }
.stat-label { font-size: 11px; color: var(--ink-faint); letter-spacing: .15em; text-transform: uppercase; margin-bottom: 10px; }
.stat-value { font-family: 'Playfair Display', serif; font-size: 32px; color: var(--accent); line-height: 1; }
.stat-value small { font-size: 13px; color: var(--ink-soft); font-family: 'DM Sans', sans-serif; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spread { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.two-col { display: grid; grid-template-columns: minmax(0,1fr) 400px; gap: 20px; align-items: start; }
@media (max-width: 980px) { .two-col { grid-template-columns: 1fr; } }
.cols-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 760px) { .cols-2 { grid-template-columns: 1fr; } }
.cols-2 > *, .two-col > *, .grid > * { min-width: 0; }

table.list { width: 100%; border-collapse: collapse; }
table.list th { text-align: left; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-faint); padding: 8px 8px; border-bottom: 1px solid var(--line-strong); font-weight: 500; }
table.list td { padding: 9px 8px; border-bottom: 1px dotted var(--line-strong); vertical-align: middle; }
table.list tr.click { cursor: pointer; } table.list tr.click:hover td { background: rgba(200,85,61,.05); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.table-scroll { overflow-x: auto; }

.badge { display: inline-block; padding: 2px 8px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; border-radius: 2px; border: 1px solid currentColor; font-weight: 700; }
.st-open { color: #6b5a3a; } .st-submitted { color: #2f6f8f; } .st-ready { color: var(--ok); } .st-paid { color: var(--ink); } .st-cancelled, .st-voided { color: var(--accent); } .st-completed { color: var(--ok); }

.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.chip { background: transparent; color: var(--ink); border: 1.5px solid var(--line-strong); padding: 7px 16px; border-radius: 2px; font-family: 'Playfair Display', serif; font-size: 15px; }
.chip.active { background: var(--accent); border-color: var(--accent); color: var(--card); }

.menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.menu-tile { background: var(--card); border: 1px solid var(--line); padding: 12px; text-align: left; min-height: 82px; display: flex; flex-direction: column; justify-content: space-between; gap: 6px; transition: border-color .15s, transform .05s; }
.menu-tile:hover:not(:disabled) { border-color: var(--accent); }
.menu-tile:active:not(:disabled) { transform: scale(.98); }
.menu-tile .nm { font-weight: 700; }
.menu-tile .pr { font-family: 'Space Mono', monospace; color: var(--accent); font-size: 13px; }
.menu-tile.off { opacity: .45; }

.table-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px; }
.table-tile { border: 1.5px solid var(--line-strong); background: var(--card); padding: 12px 8px; text-align: center; }
.table-tile .lb { font-family: 'Playfair Display', serif; font-size: 22px; }
.table-tile.busy { border-color: var(--accent); background: #fbe9e1; }
.table-tile.free:hover { border-color: var(--ok); }

.order-line { padding: 10px 0; border-bottom: 1px dotted var(--line-strong); }
.order-line .top { display: flex; justify-content: space-between; gap: 8px; }
.qty { display: inline-flex; align-items: center; border: 1px solid var(--line-strong); }
.qty button { background: transparent; border: none; width: 30px; height: 30px; font-size: 16px; color: var(--accent); font-weight: 700; }
.qty input { width: 64px; border: none; border-left: 1px solid var(--line); border-right: 1px solid var(--line); text-align: center; height: 30px; background: var(--card); }
.totals div { display: flex; justify-content: space-between; padding: 3px 0; }
.totals .grand { font-family: 'Playfair Display', serif; font-size: 22px; border-top: 1px solid var(--line-strong); margin-top: 6px; padding-top: 8px; }
.order-card { cursor: pointer; padding: 14px; }
.order-card:hover { border-color: var(--accent); }
.order-card.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }

.notice { padding: 10px 12px; border: 1px dashed var(--line-strong); background: #fffdf6; font-size: 13px; color: var(--ink-soft); margin: 10px 0; line-height: 1.5; }
.notice.bad { border-color: var(--accent); color: var(--accent-dark); background: #fdf1ec; }
.notice.ok { border-color: var(--ok); color: #3f6237; background: #f1f7ee; }
.notice ol, .notice ul { margin: 6px 0 0 20px; }

.toast-wrap { position: fixed; right: 20px; bottom: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 300; max-width: min(420px, calc(100vw - 40px)); }
.toast { background: var(--ok); color: var(--card); padding: 12px 16px; font-weight: 600; font-size: 13px; border-left: 4px solid var(--ink); box-shadow: 0 6px 24px rgba(61,40,23,.3); }
.toast.bad { background: var(--bad); border-left-color: #7a1f0d; }
.toast.info { background: var(--ink); border-left-color: var(--gold); }

.modal-back { position: fixed; inset: 0; background: rgba(61,40,23,.45); display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow: auto; z-index: 200; }
.modal { background: var(--card); border: 1px solid var(--line); width: 100%; max-width: 560px; padding: 24px; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
.modal.wide { max-width: 860px; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 18px; }

.login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.login-card { width: 100%; max-width: 420px; padding: 36px; }
.login-title { font-family: 'Playfair Display', serif; font-size: 34px; color: var(--accent); text-align: center; line-height: 1.15; }
.err { color: var(--accent); font-size: 13px; margin: 8px 0; min-height: 18px; }
.pay-methods { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.pay-methods button { padding: 12px; border: 1.5px solid var(--line-strong); background: var(--card); font-weight: 700; }
.pay-methods button.active { border-color: var(--accent); background: #fbe9e1; color: var(--accent-dark); }
.receipt-stage { background: #e9e1cc; padding: 20px; display: flex; justify-content: center; overflow: auto; }
.side-by-side { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.check-table td { padding: 5px 8px; border-bottom: 1px dotted var(--line-strong); }
.pass { color: var(--ok); font-weight: 700; } .fail { color: var(--accent); font-weight: 700; }
.hidden { display: none !important; }
@media print { body > *:not(.print-host) { display: none !important; } }

/* On-screen receipt preview. Independent from the dashboard styles: only .rc* classes.
   The printed output does not use this file; it is generated by shared/receipt.js. */
.rc-paper { background: #fff; color: #000; box-shadow: 0 2px 10px rgba(0,0,0,.18); padding: 14px 0 22px; position: relative; }
.rc-paper .rc { margin: 0 auto; font-family: 'Courier New', Courier, 'Liberation Mono', 'DejaVu Sans Mono', monospace; line-height: 1.25; }
.rc-line { white-space: pre; overflow: hidden; }
.rc-b { font-weight: bold; }
.rc-mark { height: .9em; width: 2.1em; vertical-align: -0.1em; }
.rc-caption { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #7a5e3a; text-align: center; margin-bottom: 8px; font-weight: 600; }
.rc-watermark { position: absolute; top: 8px; right: 8px; font: 700 10px 'DM Sans', sans-serif; color: #c8553d; border: 1px solid #c8553d; padding: 1px 5px; letter-spacing: .1em; }

  </style>
</head>

async function userModal(u, refresh) {
  await modal((close) => {
    const un = h("input", { class: "ink-input mono", value: u?.username || "", disabled: !!u });
    const nm = h("input", { class: "ink-input", value: u?.name || "" });
    const role = h("select", { class: "ink-input" }, h("option", { value: "cashier" }, "Cashier"), h("option", { value: "admin" }, "Administrator"));
    role.value = u?.role || "cashier";
    const pw = h("input", { class: "ink-input", type: "password", autocomplete: "new-password", placeholder: u ? "Leave blank to keep" : "At least 8 characters" });
    const err = h("div", { class: "err" });
    const save = async () => {
      try {
        if (u) await api.patch("/api/users/" + u.id, { name: nm.value, role: role.value, password: pw.value || undefined });
        else await api.post("/api/users", { username: un.value, name: nm.value, role: role.value, password: pw.value });
        toast("User saved."); close(true); refresh();
      } catch (e) { err.textContent = e.message; }
    };
    return [h("h2", null, u ? "Edit user" : "Add user"), field("Username", un), field("Full name", nm), field("Role", role), field(u ? "New password" : "Password", pw), err,
      h("div", { class: "modal-actions" }, h("button", { class: "ink-btn-ghost plain", onclick: () => close() }, "Back"), h("button", { class: "ink-btn", onclick: save }, "Save"))];
  });
